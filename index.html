<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#221B12" />
<title>MainyTrainy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg: #221B12;
  --bg-elevated: #2E2517;
  --bg-card: #2A2216;
  --border: #4A3C24;
  --border-soft: #3A2F1C;
  --gold: #E7BB4E;
  --gold-strong: #F3CE6B;
  --text-primary: #F7F1E3;
  --text-secondary: #CDBE9C;
  --text-muted: #9A8B6C;
  --red: #E15B4D;
  --blue: #5B8DEF;
  --yellow: #E7C93A;
  --orange: #EF9548;
  --danger: #E15B4D;
  --radius: 10px;
  --radius-sm: 6px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{
  margin:0; padding:0;
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-weight:600;
  font-size:16px;
  min-height:100vh;
  touch-action: pan-x pan-y;
  overscroll-behavior: none;
}
button, input, textarea, select{ font-family:inherit; }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 20px 14px;
}
.logo{
  font-family:var(--font-display);
  font-weight:900;
  letter-spacing:.06em;
  font-size:24px;
  color:var(--gold-strong);
  margin:0;
}
.topbar-right{
  display:flex;
  align-items:center;
  gap:14px;
}
.btn-outline{
  background:transparent;
  border:1.5px solid var(--gold);
  color:var(--gold-strong);
  border-radius:var(--radius-sm);
  padding:10px 18px;
  font-weight:800;
  letter-spacing:.08em;
  font-size:13px;
  cursor:pointer;
  transition: all .15s;
}
.btn-outline.small{ padding:10px 16px; }
.btn-outline:hover{ background:var(--gold); color:#221B12; }

.spinner-container {
  display: none;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
}
.spinner {
  width: 20px;
  height: 20px;
  border: 2.5px solid var(--border);
  border-top: 2.5px solid var(--gold-strong);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.spinner-container.saved { border: none; }
.spinner-container.saved .spinner { display: none; }
.spinner-container.saved::after {
  content: "✓";
  color: #5FD08A;
  font-size: 18px;
  font-weight: 900;
}

.status-bar{
  text-align:center;
  padding:10px 0;
  font-size:12px;
  font-weight:800;
  letter-spacing:.18em;
  border-top:1px solid var(--border-soft);
  border-bottom:1px solid var(--border-soft);
  color:var(--text-secondary);
}
.status-bar .dot{
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--red); margin-right:8px;
}
.status-bar.online .dot{ background:#5FD08A; }
.tabs{ display:flex; }
.tab{
  flex:1;
  background:transparent;
  border:none;
  border-bottom:3px solid var(--border-soft);
  color:var(--text-muted);
  font-weight:800;
  letter-spacing:.1em;
  font-size:13.5px;
  padding:16px 0;
  cursor:pointer;
}
.tab.active{
  color:var(--gold-strong);
  border-bottom-color:var(--gold);
}
main#view{ padding:20px; padding-bottom:140px; }
.section-label{
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:13px;
  color:var(--text-muted);
  font-weight:800;
  margin:4px 0 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.workout-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 18px 14px;
  margin-bottom:16px;
}
.workout-card h3{
  font-family:var(--font-display);
  font-weight:800;
  font-size:22px;
  margin:0 0 6px;
  color:var(--text-primary);
}
.workout-meta{
  color:var(--text-secondary);
  font-size:14px;
  font-weight:700;
}
.workout-row{
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer;
}
.workout-row .chev{ color:var(--gold); font-size:20px; font-weight:900; }
.workout-card hr{
  border:none; border-top:2px solid var(--gold);
  opacity:.85; margin:14px 0 10px;
}
.workout-card .delete-row{ text-align:right; }
.type-pip{
  display:inline-block; width:10px; height:10px; border-radius:50%;
  margin-right:8px; vertical-align:middle;
}
.btn-danger-text{
  background:none; border:none; color:var(--danger);
  font-weight:800; letter-spacing:.1em; font-size:13px; cursor:pointer; padding:6px 0;
}
.btn-gold{
  display:block; width:100%;
  background:var(--gold);
  color:#241B0C;
  border:none;
  border-radius:var(--radius-sm);
  padding:18px;
  font-weight:900;
  letter-spacing:.1em;
  font-size:15px;
  cursor:pointer;
  margin-top:8px;
}
.btn-gold-outline{
  display:block; width:100%;
  background:transparent;
  border:1.5px solid var(--gold);
  color:var(--gold-strong);
  border-radius:var(--radius-sm);
  padding:16px;
  font-weight:900;
  letter-spacing:.1em;
  font-size:14.5px;
  cursor:pointer;
}
.detail-header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:18px;
}
.back-link{
  background:none; border:none; color:var(--gold-strong);
  font-weight:800; font-size:16px; cursor:pointer; display:flex; align-items:center; gap:8px;
}
.detail-title{
  font-family:var(--font-display); font-weight:800; font-size:20px; margin-left:8px;
}
.title-row{ display:flex; align-items:center; }
.exercise-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:16px;
  position:relative;
}
.exercise-card.superset-group{
  border-left: 6px solid var(--gold);
}
.exercise-header{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
}
.exercise-header h4{
  font-family:var(--font-display); font-size:19px; font-weight:800; margin:0 0 4px;
}
.exercise-tag{
  display:inline-block;
  border:1px solid var(--border);
  color:var(--text-secondary);
  font-size:11px; font-weight:800; letter-spacing:.06em;
  padding:3px 8px; border-radius:5px; margin-top:2px;
}
.exercise-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.remove-link{ background:none; border:none; color:var(--danger); font-weight:800; font-size:12.5px; letter-spacing:.06em; cursor:pointer; }
.ex-btn-last{
  background: transparent;
  border: 1.5px solid var(--gold);
  color: var(--gold-strong);
  border-radius: 6px;
  min-width: 36px;
  height: 32px;
  padding: 0 8px;
  font-weight: 900;
  font-size: 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transition: background .12s, color .12s;
}
.ex-btn-last:active{ background: var(--gold); color: #221B12; }
.set-table{ width:100%; border-collapse:collapse; margin-top:12px; }
.set-table th{
  text-align:left; font-size:11px; letter-spacing:.06em; color:var(--text-muted);
  font-weight:800; padding-bottom:6px; border-bottom:1px solid var(--border-soft);
}
.set-table td{ padding:6px 4px; vertical-align:middle; }
.set-num{ color:var(--text-secondary); font-weight:800; width:20px; font-size:13px; }
.set-target{ display:block; font-size:10px; color:var(--text-muted); font-weight:700; margin-top:2px; }
.set-input{
  width:100%;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  color:var(--text-primary);
  border-radius:6px;
  padding:8px 4px;
  font-weight:700;
  font-size:14px;
  text-align:center;
  min-width:40px;
}
.set-input::placeholder{ color:var(--text-muted); font-weight:600; font-size:11px; }
.set-input.small-input{ padding:6px 2px; font-size:12px; min-width:30px; }
.set-x{ background:none;border:none;color:var(--text-muted); font-size:16px; cursor:pointer; padding:0 4px; }
.set-note-input{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--border-soft);
  color:var(--text-secondary);
  font-size:11px;
  padding:4px 2px;
  font-style:italic;
}
.set-note-input::placeholder{ color:var(--text-muted); font-size:10px; }
.compare-badge{
  display:block;
  font-size:9px;
  color:var(--text-muted);
  font-weight:700;
  letter-spacing:.05em;
  margin-top:2px;
}
.add-set-btn{
  width:100%;
  border:1.5px dashed var(--border);
  background:none;
  color:var(--gold-strong);
  border-radius:6px;
  padding:12px;
  font-weight:800;
  letter-spacing:.08em;
  font-size:12.5px;
  margin-top:8px;
  cursor:pointer;
}
.ex-notes{
  width:100%;
  background:transparent;
  border:none; border-top:1px solid var(--border-soft);
  color:var(--text-secondary);
  font-weight:600;
  font-style:italic;
  padding:10px 0 0;
  margin-top:8px;
  resize:vertical;
  min-height:36px;
}
.ex-notes::placeholder{ color:var(--text-muted); }
.add-exercise-box{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:18px;
}
.field-label{
  font-size:12px; letter-spacing:.1em; color:var(--text-muted); font-weight:800; margin-bottom:6px;
}
.text-input, .select-input{
  width:100%;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  color:var(--text-primary);
  border-radius:8px;
  padding:12px 14px;
  font-weight:700;
  font-size:15px;
  margin-bottom:10px;
}
.text-input::placeholder{ color:var(--text-muted); font-style:italic; font-weight:600; }
.row-flex{ display:flex; gap:10px; }
.row-flex .text-input{ margin-bottom:0; }
.template-grid{ display:grid; gap:14px; }
.template-card{
  background:var(--bg-card);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
}
.template-card:active{ border-color:var(--gold); }
.template-card h4{ font-family:var(--font-display); font-size:19px; margin:0 0 4px; }
.template-card p{ margin:0; color:var(--text-secondary); font-size:13px; font-weight:700; }
.template-swatch{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
.cal-header{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;
}
.cal-nav{
  background:transparent; border:1.5px solid var(--border); color:var(--gold-strong);
  border-radius:8px; width:44px; height:44px; font-size:18px; font-weight:800; cursor:pointer;
}
.cal-title{ font-family:var(--font-display); font-weight:800; font-size:20px; letter-spacing:.06em; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-dow{ text-align:center; font-size:11px; color:var(--text-muted); font-weight:800; letter-spacing:.08em; padding-bottom:6px; }
.cal-cell{
  aspect-ratio:1;
  display:flex; align-items:center; justify-content:center;
  border-radius:8px;
  font-weight:800;
  font-size:15px;
  color:var(--text-secondary);
  background:var(--bg-card);
  border:1px solid var(--border-soft);
  cursor:default;
  transition: transform .1s;
}
.cal-cell.empty{ background:transparent; border:none; }
.cal-cell.today{ border-color:var(--gold); border-width:2px; }
.cal-cell.trained{ color:#20180C; font-weight:900; cursor:pointer; }
.cal-cell.trained:active{ transform:scale(0.92); }
.cal-legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:22px; }
.legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-secondary); font-weight:700; }
.legend-swatch{ width:13px; height:13px; border-radius:4px; }
.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.stat-box{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 8px; text-align:center;
}
.stat-box .stat-label{ font-size:10px; letter-spacing:.1em; color:var(--text-muted); font-weight:800; margin-bottom:4px; }
.stat-box .stat-value{ font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--gold-strong); }
.stat-section-title{ font-weight:800; font-size:14px; color:var(--text-secondary); margin:20px 0 4px; letter-spacing:.04em; }
.empty-state{ color:var(--text-muted); font-weight:700; text-align:center; padding:40px 10px; font-size:14.5px; }
.best-row{
  display:flex; flex-wrap:wrap; gap:12px; margin:8px 0 12px;
  background:var(--bg-elevated); padding:10px 14px; border-radius:6px;
  border-left: 4px solid var(--gold);
}
.best-item{ font-size:13px; font-weight:700; color:var(--text-secondary); }
.best-item strong{ color:var(--gold-strong); font-family:var(--font-display); font-weight:900; }
.chart-container{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-top:16px;
}
.chart-container canvas{ max-height:200px; width:100% !important; }
.chart-title{
  font-family:var(--font-display);
  font-size:13px;
  font-weight:800;
  letter-spacing:.1em;
  color:var(--gold-strong);
  text-transform:uppercase;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* ── TIMER ── */
.overlay{
  position:fixed; inset:0; background:rgba(20,15,8,.85);
  display:flex; align-items:center; justify-content:center; z-index:50;
  padding: 16px;
}
.overlay.hidden{ display:none; }
.timer-box{
  background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
  padding:26px 22px;
  width:100%;
  max-width:380px;
}
.timer-tabs{
  display:flex; gap:8px; margin-bottom:18px;
}
.timer-tab{
  flex:1;
  background:transparent;
  border:1.5px solid var(--border);
  color:var(--text-muted);
  border-radius:var(--radius-sm);
  padding:12px 8px;
  font-weight:800;
  letter-spacing:.08em;
  font-size:12px;
  cursor:pointer;
  transition: all .15s;
}
.timer-tab.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#221B12;
}
.timer-countdown-inputs{
  display:flex; gap:10px; margin-bottom:12px;
}
.timer-input-group{ flex:1; }
.timer-input-label{
  font-size:11px; color:var(--text-muted); font-weight:800;
  letter-spacing:.1em; display:block; margin-bottom:6px; text-align:center;
}
.timer-input{
  width:100%;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  color:var(--gold-strong);
  border-radius:8px;
  padding:14px 8px;
  font-size:26px;
  font-weight:900;
  text-align:center;
  font-family:var(--font-display);
  -webkit-appearance:none;
  outline:none;
}
.timer-input:focus{ border-color:var(--gold); }
.timer-presets{
  display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;
}
.timer-preset{
  flex:1; min-width:60px;
  background:transparent;
  border:1px dashed var(--border);
  color:var(--text-secondary);
  border-radius:6px;
  padding:8px 6px;
  font-weight:800;
  letter-spacing:.06em;
  font-size:11px;
  cursor:pointer;
}
.timer-preset:active{
  background:var(--gold); color:#221B12; border-color:var(--gold);
}
.timer-display{
  font-family:var(--font-display); font-size:56px; font-weight:900; color:var(--gold-strong);
  margin:12px 0 22px; text-align:center; letter-spacing:.04em;
  line-height: 1;
}
.timer-display.finished{
  color:var(--red);
  animation: finishPulse 0.9s ease infinite;
}
@keyframes finishPulse {
  0%, 100% { text-shadow: 0 0 30px rgba(225,91,77,0.6); }
  50% { text-shadow: 0 0 80px rgba(225,91,77,1), 0 0 40px rgba(225,91,77,0.8); }
}
.timer-controls{ display:flex; gap:10px; margin-bottom:14px; }
.btn-text{ background:none; border:none; color:var(--text-muted); font-weight:700; cursor:pointer; }
.modal-sheet{
  position:fixed; inset:0; z-index:60;
  background:rgba(20,15,8,.85);
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet.hidden{ display:none; }
.modal-inner{
  background:var(--bg); width:100%; max-width:560px;
  border-radius:20px 20px 0 0; padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:85vh; overflow-y:auto;
  border-top:1px solid var(--border);
}
.modal-title{ font-family:var(--font-display); font-size:22px; font-weight:800; margin:0 0 18px; }

.ex-name-display{
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:6px;
  padding:2px 6px 2px 4px;
  margin-left:-4px;
  transition:background .15s, color .15s;
}
.ex-name-display:hover,
.ex-name-display:active{
  background:rgba(231,187,78,0.14);
  color:var(--gold-strong);
}
.ex-name-pencil{ font-size:12px; opacity:0.5; font-weight:900; }
.ex-name-display:hover .ex-name-pencil{ opacity:1; }
.ex-name-editing{ display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.ex-name-editing input{
  flex:1;
  background:var(--bg-elevated);
  border:1.5px solid var(--gold);
  color:var(--text-primary);
  border-radius:6px;
  padding:8px 10px;
  font-weight:800;
  font-size:17px;
  font-family:var(--font-display);
  outline:none;
  min-width:0;
}
.ex-name-save-btn,
.ex-name-cancel-btn{
  background:var(--gold);
  border:none;
  color:#221B12;
  font-weight:900;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:15px;
  flex-shrink:0;
}
.ex-name-cancel-btn{
  background:transparent;
  color:var(--text-muted);
  border:1px solid var(--border);
}

.tpl-ex-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  margin-bottom:10px;
}
.tpl-ex-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.tpl-ex-name{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:800;
  margin:0 0 4px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.tpl-ex-name:hover{ color:var(--gold-strong); }
.tpl-ex-meta{
  font-size:11px;
  color:var(--text-secondary);
  font-weight:800;
  letter-spacing:.06em;
}

.block-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin:28px 0 14px;
  color:var(--gold-strong);
  font-family:var(--font-display);
  font-weight:800;
  font-size:14px;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.block-header::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}
.block-header:first-child{ margin-top:0; }

.block-add-box{
  background:transparent;
  border:1px dashed var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:18px;
}
.block-btn{
  display:block;
  width:100%;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  color:var(--gold-strong);
  border-radius:8px;
  padding:14px;
  font-weight:800;
  letter-spacing:.08em;
  font-size:13px;
  cursor:pointer;
  margin-bottom:8px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
}
.block-btn:last-child{ margin-bottom:0; }
.block-btn:active{ background:var(--gold); color:#221B12; }

.fixed-footer{
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 20px calc(16px + env(safe-area-inset-bottom));

function openTimer() {

function readCountdownInput() {
  const m = parseInt(document.getElementById('timerMin').value) || 0;
  const s = parseInt(document.getElementById('timerSec').value) || 0;
  return m * 60 + s;
}

function setTimerMode(mode) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerRunning = false;
  timerFinished = false;
  timerMode = mode;

  document.querySelectorAll('.timer-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });

  const cd = document.getElementById('countdownInputs');
  const cp = document.getElementById('countdownPresets');
  if (mode === 'countdown') {
    cd.style.display = 'flex';
    cp.style.display = 'flex';
    timerSeconds = readCountdownInput();
    timerTarget = timerSeconds;
  } else {
    cd.style.display = 'none';
    cp.style.display = 'none';
    timerSeconds = 0;
    timerTarget = 0;
  }

  document.getElementById('timerStartPause').textContent = 'START';
  document.getElementById('timerDisplay').classList.remove('finished', 'running');
  updateTimerDisplay();
}

function toggleTimer() {
  if (timerFinished) {
    // Dismiss finished → reset and go back to idle
    setTimerMode(timerMode);
    return;
  }

  if (timerRunning) {
    timerRunning = false;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    document.getElementById('timerStartPause').textContent = 'RESUME';
    return;
  }

  // Unlock audio on user gesture
  unlockAudio();

  // Fresh start
  if (timerMode === 'countdown' && timerSeconds <= 0) {
    timerSeconds = readCountdownInput();
    timerTarget = timerSeconds;
    if (timerSeconds <= 0) {
      alert('Please set minutes or seconds first.');
      return;
    }
  }

  timerRunning = true;
  timerFinished = false;
  document.getElementById('timerStartPause').textContent = 'PAUSE';
  document.getElementById('timerDisplay').classList.remove('finished');

  timerInterval = setInterval(() => {
    if (timerMode === 'countdown') {
      timerSeconds--;
      if (timerSeconds <= 0) {
        timerSeconds = 0;
        timerRunning = false;
        timerFinished = true;
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        document.getElementById('timerStartPause').textContent = 'DISMISS';

        updateTimerDisplay();
        playBell();
        return;
      }
    } else {
      timerSeconds++;

    updateTimerDisplay();
  }, 1000);

  updateTimerDisplay();
}

// ── Bell sound (Web Audio API) ──
let _audioCtx = null;

function getAudioCtx() {
  if (!_audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { _audioCtx = new AC(); } catch (e) { return null; }
  }
  if (_audioCtx.state === 'suspended') {
    _audioCtx.resume().catch(() => {});
  }
  return _audioCtx;
}

// Must be called on a user gesture to unlock audio on iOS
function unlockAudio() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  // Silent buffer to fully unlock on iOS
  try {
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch (e) {}
}

function playBell() {
  const ctx = getAudioCtx();

  // Vibration for mobile (works even without audio)
  if (navigator.vibrate) {
    try { navigator.vibrate([250, 120, 250, 120, 500]); } catch (e) {}
  }

  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});

  // 3 distinct "dings" with bell-like harmonics
  const dings = 3;
  const spacing = 0.48;
  const t0 = ctx.currentTime + 0.03;

  for (let i = 0; i < dings; i++) {
    const start = t0 + i * spacing;
    const harmonics = [
      { f: 1046.5, g: 0.28, d: 1.10 },  // C6 fundamental
      { f: 2093.0, g: 0.14, d: 0.85 },  // C7
      { f: 2637.0, g: 0.08, d: 0.65 },  // E7
      { f: 1567.98, g: 0.10, d: 0.95 }, // G6
    ];
    harmonics.forEach(({ f, g, d }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(g, start + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + d + 0.05);
    });
  }
}

async function loadTemplates() {
  try {
    const { data, error } = await supabase.from('templates').select('*');
    if (error) {
      console.warn('Templates table not reachable, using defaults:', error.message);
      templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
      return;
    }
    if (!data || data.length === 0) {
      const rows = Object.keys(DEFAULT_TEMPLATES).map((k, i) => ({
        name: k,
        color: DEFAULT_TEMPLATES[k].color,
        exercises: DEFAULT_TEMPLATES[k].exercises,
        sort_order: i,
        is_block: DEFAULT_TEMPLATES[k].isBlock === true,
      }));
      let { error: insErr } = await supabase.from('templates').insert(rows);
      if (insErr && /column .*is_block/i.test(insErr.message)) {
        const rowsNoBlock = rows.map(r => {
          const { is_block, ...rest } = r;
          return rest;
        });
        await supabase.from('templates').insert(rowsNoBlock);
      } else if (insErr) {
        console.warn('Could not seed templates:', insErr.message);
      }
      templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
      return;
    }
    templates = {};
    data
      .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
      .forEach(row => {
        templates[row.name] = {
          color: row.color || 'gray',
          exercises: Array.isArray(row.exercises) ? row.exercises : [],
          isBlock: row.is_block === true,
        };
      });
    Object.keys(DEFAULT_TEMPLATES).forEach(async (k, i) => {
      if (!templates[k]) {
        templates[k] = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[k]));
        const row = {
          name: k,
          color: DEFAULT_TEMPLATES[k].color,
          exercises: DEFAULT_TEMPLATES[k].exercises,
          sort_order: i,
          is_block: DEFAULT_TEMPLATES[k].isBlock === true,
        };
        let { error: insErr } = await supabase.from('templates').insert(row);
        if (insErr && /column .*is_block/i.test(insErr.message)) {
          const { is_block, ...rest } = row;
          await supabase.from('templates').insert(rest);
        }
      }
    });
  } catch (e) {
    console.warn('Template load error, using defaults:', e);
    templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
  }
}

async function saveTemplate(name) {
  const tpl = templates[name];
  if (!tpl) return;
  const base = {
    name,
    color: tpl.color,
    exercises: tpl.exercises,
    sort_order: Object.keys(templates).indexOf(name),
  };
  let { error } = await supabase.from('templates').upsert(
    { ...base, is_block: tpl.isBlock === true },
    { onConflict: 'name' }
  );
  if (error && /column .*is_block/i.test(error.message)) {
    ({ error } = await supabase.from('templates').upsert(base, { onConflict: 'name' }));
  }
  if (error) {
    console.error('Template save error:', error);
    alert('Error saving template.');
  }
}

async function deleteTemplate(name) {
  const tpl = templates[name];
  if (!tpl) return;
  const { error } = await supabase.from('templates').delete().eq('name', name);
  if (error) { console.error(error); alert('Error deleting.'); return; }
  delete templates[name];
}

async function renameTemplate(oldName, newName) {
  if (!newName || newName === oldName) return false;
  if (templates[newName]) {
    alert('A template with this name already exists.');
    return false;
  }
  const tpl = templates[oldName];
  if (!tpl) return false;

  const sortOrder = Object.keys(templates).indexOf(oldName);

  const insertRow = {
    name: newName,
    color: tpl.color,
    exercises: tpl.exercises,
    sort_order: sortOrder,
    is_block: tpl.isBlock === true,
  };
  let { error: insErr } = await supabase.from('templates').insert(insertRow);
  if (insErr && /column .*is_block/i.test(insErr.message)) {
    const { is_block, ...rest } = insertRow;
    ({ error: insErr } = await supabase.from('templates').insert(rest));
  }
  if (insErr) {
    console.error('Rename insert failed:', insErr);
    alert('Error renaming.');
    return false;
  }

  const { error: delErr } = await supabase.from('templates').delete().eq('name', oldName);
  if (delErr) console.error('Rename delete failed:', delErr);

  const newTemplates = {};
  Object.keys(templates).forEach(k => {
    if (k === oldName) newTemplates[newName] = tpl;
    else newTemplates[k] = templates[k];
  });
  templates = newTemplates;
  return true;
}

    await supabase.from('workouts').delete().eq('id', n.dataset.delete);
    await loadWorkouts();
    render();
  }));
}

function exportData() {
  if (!workouts.length) { alert('No data to export.'); return; }
  const dataStr = JSON.stringify({ workouts, templates }, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mainytrainy_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function createWorkout(typeName, date) {
  let tpl = templates[typeName];
  if (!tpl) tpl = templates['Custom'] || { color: 'gray', exercises: [] };
  const exercises = JSON.parse(JSON.stringify(tpl.exercises));
  const payload = {
    type: typeName,
    date: date || new Date().toISOString().slice(0, 10),
    finished: false,
    exercises,
  };
  const { data, error } = await supabase.from('workouts').insert(payload).select().single();
  if (error) { alert('Error saving.'); console.error(error); return; }
  workouts.unshift(data);
  currentWorkoutId = data.id;
  render();
}

function startInlineRename(anchorEl, currentName, onFinish) {
  const wrapper = document.createElement('div');
  wrapper.className = 'ex-name-editing';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentName;
  input.autocomplete = 'off';

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.className = 'ex-name-save-btn';
  saveBtn.textContent = '✓';

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'ex-name-cancel-btn';
  cancelBtn.textContent = '✕';

  wrapper.appendChild(input);
  wrapper.appendChild(saveBtn);
  wrapper.appendChild(cancelBtn);
  anchorEl.replaceWith(wrapper);
  input.focus();
  input.select();

  let finished = false;
  const finish = (save) => {
    if (finished) return;
    finished = true;
    const val = input.value.trim();
    onFinish(save ? val : null);
  };

  saveBtn.addEventListener('click', () => finish(true));
  cancelBtn.addEventListener('click', () => finish(false));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => { if (!finished) finish(false); }, 120);
  });
}

async function renameExercise(workoutId, exIdx, newName) {
  if (!newName) return;
  const idx = workouts.findIndex(x => x.id === workoutId);
  if (idx === -1) return;
  if (!workouts[idx].exercises[exIdx]) return;
  workouts[idx].exercises[exIdx].name = newName;
  const exercises = JSON.parse(JSON.stringify(workouts[idx].exercises));
  triggerSaveIndicator();
  try {
    await patchWorkout(workoutId, { exercises });
  } catch (e) { console.error(e); }
}

async function copyLastForExercise(w, exIdx) {
  if (!currentWorkoutId) return;

  await saveAllInputs(w);
  const freshW = workouts.find(x => x.id === currentWorkoutId);
  if (!freshW) return;
  const currentEx = freshW.exercises[exIdx];
  if (!currentEx) return;
  const exName = currentEx.name;

  const curDate = freshW.date || '';
  const curCreated = String(freshW.created_at || '');
  let best = null;
  workouts.forEach(other => {
    if (other.id === freshW.id) return;
    if (!other.date) return;
    let isEarlier = false;
    if (other.date < curDate) isEarlier = true;
    else if (other.date === curDate && String(other.created_at || '') < curCreated) isEarlier = true;
    if (!isEarlier) return;
    const found = (other.exercises || []).find(e => e.name === exName);
    if (!found) return;
    if (!best || other.date > best.workout.date ||
        (other.date === best.workout.date && String(other.created_at || '') > String(best.workout.created_at || ''))) {
      best = { workout: other, exercise: found };
    }
  });

  if (!best || !Array.isArray(best.exercise.sets) || !best.exercise.sets.length) {
    alert(`No earlier workout with "${exName}" found.`);
    return;
  }

  const hasValue = (currentEx.sets || []).some(s =>
    (s.reps && s.reps !== '') || (s.kg && s.kg !== '') || (s.duration && s.duration !== '')
  );
  if (hasValue) {
    if (!confirm(`Copy values for "${exName}" from workout on ${formatDate(best.workout.date)}?\nExisting values will be overwritten.`)) return;
  }

  const exercises = JSON.parse(JSON.stringify(freshW.exercises || []));
  const target = exercises[exIdx];
  if (!target) return;
  if (!Array.isArray(target.sets)) target.sets = [];
  if (!Array.isArray(target.setMeta)) target.setMeta = [];

  const srcSets = best.exercise.sets;
  for (let i = 0; i < srcSets.length; i++) {
    const src = srcSets[i] || {};
    if (!target.sets[i]) {
      target.sets[i] = { reps: '', kg: '', duration: '', done: false, rpe: '', setNotes: '' };
      target.setMeta[i] = (best.exercise.setMeta && best.exercise.setMeta[i]) ? { ...best.exercise.setMeta[i] } : {};
    }
    target.sets[i].reps = src.reps != null ? String(src.reps) : '';
    target.sets[i].kg = src.kg != null ? String(src.kg) : '';
    target.sets[i].duration = src.duration != null ? String(src.duration) : '';
    target.sets[i].rpe = src.rpe != null ? String(src.rpe) : '';
    target.sets[i].done = false;
  }

  await patchWorkout(freshW.id, { exercises });
  render();
}

async function saveAllInputs(workoutParam) {
  let w = workoutParam;
  if (!w) {
    if (!currentWorkoutId) return;
    w = workouts.find(x => x.id === currentWorkoutId);
    if (!w) return;
  }

  showSaving();
  try {
    const inputs = document.querySelectorAll('input.set-input');
    const exercises = JSON.parse(JSON.stringify(w.exercises || []));

    inputs.forEach(inp => {
      const exI = parseInt(inp.dataset.ex);
      const setIdx = parseInt(inp.dataset.set);
      const field = inp.dataset.field;
      const value = inp.value;
      if (exercises[exI] && exercises[exI].sets[setIdx]) {
        exercises[exI].sets[setIdx][field] = value;
      }
    });

    document.querySelectorAll('input.set-rpe').forEach(inp => {
      const exI = parseInt(inp.dataset.ex);
      const setIdx = parseInt(inp.dataset.set);
      if (exercises[exI] && exercises[exI].sets[setIdx]) {
        exercises[exI].sets[setIdx].rpe = inp.value;
      }
    });

    document.querySelectorAll('input.set-note-input').forEach(inp => {
      const exI = parseInt(inp.dataset.ex);
      const setIdx = parseInt(inp.dataset.set);
      if (exercises[exI] && exercises[exI].sets[setIdx]) {
        exercises[exI].sets[setIdx].setNotes = inp.value;
      }
    });

    document.querySelectorAll('textarea.ex-notes').forEach(ta => {
      const exI = parseInt(ta.dataset.notes);
      if (exercises[exI]) exercises[exI].notes = ta.value;
    });

    const idx = workouts.findIndex(x => x.id === w.id);
    if (idx > -1) workouts[idx].exercises = exercises;

    await patchWorkout(w.id, { exercises });
    hideSaving(true);
  } catch (e) {
    console.error('Save error:', e);
    hideSaving(false);
  }
}

function renderExerciseCard(w, exItem, exIdx) {
  const card = document.createElement('div');
  card.className = 'exercise-card';
  const isDuration = exItem.inputType === 'duration';
  const col1 = isDuration ? 'Duration' : 'Reps';

  if (exItem.group && exItem.group.trim() !== '') {
    card.classList.add('superset-group');
    card.style.borderLeftColor = 'var(--gold)';
  }

  let prevReps = '', prevKg = '', prevDur = '';
  const prevWorkout = getPreviousWorkoutWithExercise(w, exItem.name);
  if (prevWorkout) {
    const prevEx = prevWorkout.exercises.find(e => e.name === exItem.name);
    if (prevEx && prevEx.sets && prevEx.sets.length) {
      const lastSet = prevEx.sets[prevEx.sets.length - 1];
      if (lastSet.reps) prevReps = lastSet.reps;
      if (lastSet.kg) prevKg = lastSet.kg;
      if (lastSet.duration) prevDur = lastSet.duration;
    }
  }
  const compareText = (prevReps || prevKg || prevDur) ? `↺ last: ${prevReps ? prevReps + ' reps' : ''} ${prevKg ? prevKg + 'kg' : ''} ${prevDur ? prevDur + 's' : ''}`.trim() : '';

  const rows = (exItem.sets || []).map((s, sIdx) => {
    const meta = (exItem.setMeta && exItem.setMeta[sIdx]) || {};
    const targetNote = meta.label || meta.target ? `<span class="set-target">${[meta.label, meta.target].filter(Boolean).join(' · ')}</span>` : '';
    const col1Val = isDuration ? s.duration : s.reps;
    const col1Placeholder = isDuration ? (meta.target || 'sec') : '—';
    return `
      <tr>
        <td class="set-num">${sIdx + 1}${targetNote}</td>
        <td style="min-width:60px;">
          <input class="set-input" data-field="${isDuration ? 'duration' : 'reps'}" data-ex="${exIdx}" data-set="${sIdx}" placeholder="${col1Placeholder}" value="${escapeAttr(col1Val)}" />
          ${compareText ? `<span class="compare-badge">${escapeHtml(compareText)}</span>` : ''}
        </td>
        <td><input class="set-input" data-field="kg" data-ex="${exIdx}" data-set="${sIdx}" placeholder="kg" value="${escapeAttr(s.kg)}" /></td>
        <td><input class="set-input small-input" data-field="rpe" data-ex="${exIdx}" data-set="${sIdx}" placeholder="RPE" value="${escapeAttr(s.rpe || '')}" style="max-width:40px;" /></td>
        <td><input class="set-note-input" placeholder="Note..." data-ex="${exIdx}" data-set="${sIdx}" value="${escapeAttr(s.setNotes || '')}" /></td>
        <td><button class="set-x" data-removeset="${exIdx}:${sIdx}">×</button></td>
      </tr>`;
  }).join('');

  card.innerHTML = `
    <div class="exercise-header">
      <div style="flex:1;min-width:0;">
        <h4>
          <span class="ex-name-display" data-renameex="${exIdx}" title="Tap to rename">
            <span class="ex-name-text">${escapeHtml(exItem.name)}</span>
            <span class="ex-name-pencil">✎</span>
          </span>
          ${exItem.group ? `<span style="font-size:12px;color:var(--gold);font-weight:700;">[${escapeHtml(exItem.group)}]</span>` : ''}
        </h4>
        <span class="exercise-tag">${isDuration ? 'TIME' : 'SETS & REPS'}</span>
        ${exItem.note ? `<div class="set-target" style="margin-top:6px;">${escapeHtml(exItem.note)}</div>` : ''}
      </div>
      <div class="exercise-actions">
        <button class="ex-btn-last" data-copylast="${exIdx}" title="Copy values from last time">↺</button>
        <button class="remove-link" data-removeex="${exIdx}">REMOVE</button>
      </div>
    </div>
    <table class="set-table">
      <thead><tr><th>#</th><th>${col1}</th><th>KG</th><th>RPE</th><th>Note</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="add-set-btn" data-addset="${exIdx}">+ ADD SET</button>
    <textarea class="ex-notes" placeholder="Exercise Notes..." data-notes="${exIdx}">${escapeHtml(exItem.notes || '')}</textarea>
  `;

  card.querySelectorAll('.set-input, .set-rpe, .set-note-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const exI = parseInt(inp.dataset.ex);
      const setIdx = parseInt(inp.dataset.set);
      let field = inp.dataset.field;
      if (!field) {
        if (inp.classList.contains('set-rpe')) field = 'rpe';
        else if (inp.classList.contains('set-note-input')) field = 'setNotes';
      }
      if (field) updateSetField(w, exI, setIdx, field, inp.value);
    });
  });

  card.querySelectorAll('[data-removeset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [exI, sI] = btn.dataset.removeset.split(':').map(Number);
      removeSet(w, exI, sI);
    });
  });

  card.querySelector('[data-addset]').addEventListener('click', async () => {
    await saveAllInputs(w);
    const freshWorkout = workouts.find(x => x.id === w.id);
    if (!freshWorkout) return;
    const exercises = freshWorkout.exercises;
    if (!exercises[exIdx]) return;
    exercises[exIdx].sets.push({ reps: '', kg: '', duration: '', done: false, rpe: '', setNotes: '' });
    if (!exercises[exIdx].setMeta) exercises[exIdx].setMeta = [];
    exercises[exIdx].setMeta.push({});
    await patchWorkout(w.id, { exercises });
    render();
  });

  card.querySelector('[data-copylast]').addEventListener('click', () => {
    copyLastForExercise(w, exIdx);
  });

  const nameDisplay = card.querySelector('[data-renameex]');
  nameDisplay.addEventListener('click', async () => {
    await saveAllInputs(w);
    const freshW = workouts.find(x => x.id === w.id);
    if (!freshW) return;
    const freshEx = freshW.exercises[exIdx];
    if (!freshEx) return;
    const currentName = freshEx.name;
    startInlineRename(nameDisplay, currentName, async (newName) => {
      if (newName && newName !== currentName) {
        await renameExercise(w.id, exIdx, newName);
      }
      render();
    });
  });

  card.querySelector('[data-removeex]').addEventListener('click', () => removeExercise(w, exIdx));
  card.querySelector('[data-notes]').addEventListener('change', (e) => updateExerciseNotes(w, exIdx, e.target.value));

  return card;
}

async function patchWorkout(id, patch) {
  triggerSaveIndicator();
  try {
    const { data, error } = await supabase.from('workouts').update(patch).eq('id', id).select().single();
    if (error) { console.error(error); return; }
    const idx = workouts.findIndex(x => x.id === id);
    if (idx > -1) workouts[idx] = data;
  } finally {
    setTimeout(() => hideSaving(true), 2000);
  }
}

function cloneExercises(w) { return JSON.parse(JSON.stringify(w.exercises || [])); }

async function updateSetField(w, exI, sI, field, value) {
  const idx = workouts.findIndex(x => x.id === w.id);
  if (idx > -1) {
    if (!workouts[idx].exercises[exI] || !workouts[idx].exercises[exI].sets[sI]) return;
    workouts[idx].exercises[exI].sets[sI][field] = value;
  }
  triggerSaveIndicator();
  try {
    const exercises = cloneExercises(w);
    if (!exercises[exI] || !exercises[exI].sets[sI]) return;
    exercises[exI].sets[sI][field] = value;
    await patchWorkout(w.id, { exercises });
  } catch (e) { console.error(e); }
}

async function removeSet(w, exI, sI) {
  const idx = workouts.findIndex(x => x.id === w.id);
  if (idx > -1) {
    workouts[idx].exercises[exI].sets.splice(sI, 1);
    if (workouts[idx].exercises[exI].setMeta) workouts[idx].exercises[exI].setMeta.splice(sI, 1);
  }
  triggerSaveIndicator();
  try {
    const exercises = cloneExercises(w);
    exercises[exI].sets.splice(sI, 1);
    if (exercises[exI].setMeta) exercises[exI].setMeta.splice(sI, 1);
    await patchWorkout(w.id, { exercises });
  } catch (e) { console.error(e); }
  render();
}

async function removeExercise(w, exI) {
  const idx = workouts.findIndex(x => x.id === w.id);
  if (idx > -1) workouts[idx].exercises.splice(exI, 1);
  triggerSaveIndicator();
  try {
    const exercises = cloneExercises(w);
    exercises.splice(exI, 1);
    await patchWorkout(w.id, { exercises });
  } catch (e) { console.error(e); }
  render();
}

async function updateExerciseNotes(w, exI, notes) {
  const idx = workouts.findIndex(x => x.id === w.id);
  if (idx > -1 && workouts[idx].exercises[exI]) workouts[idx].exercises[exI].notes = notes;
  triggerSaveIndicator();
  try {
    const exercises = cloneExercises(w);
    if (exercises[exI]) exercises[exI].notes = notes;
    await patchWorkout(w.id, { exercises });
  } catch (e) { console.error(e); }
}

function getPreviousWorkoutWithExercise(currentWorkout, exerciseName) {
  const currentDate = currentWorkout.date;
  let prev = null;
  for (const w of workouts) {
    if (w.id === currentWorkout.id) continue;
    if (w.date >= currentDate) continue;
    if (!w.exercises) continue;
    const hasEx = w.exercises.some(e => e.name === exerciseName);
    if (hasEx) {
      if (!prev || w.date > prev.date) prev = w;
    }
  }
  return prev;
}

function renderCalendar() {
  const el = document.getElementById('view');
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  el.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" id="calPrev">←</button>
      <div class="cal-title">${monthNames[month].toUpperCase()} ${year}</div>
      <button class="cal-nav" id="calNext">→</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <div class="legend-item"><span class="legend-swatch" style="background:${TYPE_COLORS.red}"></span>Push</div>
      <div class="legend-item"><span class="legend-swatch" style="background:${TYPE_COLORS.blue}"></span>Pull</div>
      <div class="legend-item"><span class="legend-swatch" style="background:${TYPE_COLORS.yellow}"></span>Leg & Abs</div>
      <div class="legend-item"><span class="legend-swatch" style="background:${TYPE_COLORS.orange}"></span>Volleyball</div>
    </div>
  `;
  document.getElementById('calPrev').addEventListener('click', () => { calMonth = new Date(year, month - 1, 1); render(); });
  document.getElementById('calNext').addEventListener('click', () => { calMonth = new Date(year, month + 1, 1); render(); });

  const grid = document.getElementById('calGrid');
  ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach(d => {
    const c = document.createElement('div'); c.className = 'cal-dow'; c.textContent = d; grid.appendChild(c);
  });

  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay() - 1;
  if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const byDate = {};
  workouts.forEach(w => { byDate[w.date] = byDate[w.date] || []; byDate[w.date].push(w); });
  const todayStr = new Date().toISOString().slice(0, 10);

  for (let i = 0; i < startOffset; i++) {
    const c = document.createElement('div'); c.className = 'cal-cell empty'; grid.appendChild(c);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayWorkouts = byDate[dateStr];
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (dateStr === todayStr) cell.classList.add('today');
    if (dayWorkouts && dayWorkouts.length) {
      cell.classList.add('trained');
      const colorKey = templates[dayWorkouts[0].type]?.color || 'gray';
      cell.style.background = TYPE_COLORS[colorKey];
      cell.addEventListener('click', () => {
        if (dayWorkouts.length === 1) {
          currentWorkoutId = dayWorkouts[0].id;
          render();
        } else {
          openDayWorkoutPicker(dayWorkouts);
        }
      });
    }
    cell.textContent = d;
    grid.appendChild(cell);
  }
}

function openDayWorkoutPicker(workoutsForDay) {
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.innerHTML = `
    <div class="modal-inner">
      <h3 class="modal-title">Workouts on this day</h3>
      <div class="template-grid" id="dayPickList"></div>
      <button class="btn-outline" id="closeDayPick" style="width:100%;margin-top:16px;">CLOSE</button>
    </div>`;
  document.body.appendChild(sheet);
  sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.remove(); });

  const list = sheet.querySelector('#dayPickList');
  workoutsForDay.forEach(w => {
    const tpl = templates[w.type] || { color: 'gray' };
    const card = document.createElement('div');
    card.className = 'template-card';
    card.innerHTML = `<div><h4>${escapeHtml(w.type)}</h4><p>${(w.exercises || []).length} ex · ${w.finished ? '✅ Finished' : '⏳ In Progress'}</p></div>
      <span class="template-swatch" style="background:${TYPE_COLORS[tpl.color] || TYPE_COLORS.gray}"></span>`;
    card.addEventListener('click', () => {
      sheet.remove();
      currentWorkoutId = w.id;
      render();
    });
    list.appendChild(card);
  });

  sheet.querySelector('#closeDayPick').addEventListener('click', () => sheet.remove());
}

function allKnownExerciseNames() {
  const names = new Set();
  Object.values(templates).forEach(t => (t.exercises || []).forEach(e => names.add(e.name)));
  workouts.forEach(w => (w.exercises || []).forEach(e => names.add(e.name)));
  return Array.from(names).sort();
}

function renderAnalysis() {
  const el = document.getElementById('view');
  const names = allKnownExerciseNames();
  el.innerHTML = `
    <div class="section-label">Exercise Analysis</div>
    <select class="select-input" id="exSelect">
      <option value="">Choose an exercise…</option>
      ${names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('')}
    </select>
    <div id="statOut"></div>
  `;
  document.getElementById('exSelect').addEventListener('change', (e) => renderStatsFor(e.target.value));
}

function renderStatsFor(name) {
  const out = document.getElementById('statOut');
  if (!name) { out.innerHTML = ''; destroyCharts(); return; }

  destroyCharts();

  const sets = [];
  const weightHistory = [];
  const repsHistory = [];

  workouts.forEach(w => {
    (w.exercises || []).forEach(exItem => {
      if (exItem.name !== name) return;
      (exItem.sets || []).forEach(s => {
        const reps = parseFloat(s.reps);
        const kg = parseFloat(s.kg);
        const dur = parseFloat(s.duration);
        const validReps = !isNaN(reps) && reps > 0;
        const validKg = !isNaN(kg) && kg > 0;
        const validDur = !isNaN(dur) && dur > 0;
        if (validReps || validKg || validDur) {
          sets.push({ reps, kg, duration: dur, date: w.date });
          if (validReps) {
            repsHistory.push({ date: w.date, reps });
          }
          if (validKg && validReps) {
            weightHistory.push({ date: w.date, kg, volume: kg * reps, oneRM: kg * (1 + reps / 30) });
          } else if (validKg) {
            weightHistory.push({ date: w.date, kg, volume: null, oneRM: null });
          }
        }
      });
    });
  });

  if (!sets.length) {
    out.innerHTML = `<div class="empty-state">No values for "${escapeHtml(name)}" yet.</div>`;
    return;
  }

  const hasWeight = weightHistory.length > 0;
  const hasReps = repsHistory.length > 0;

  let maxKg = 0, maxVol = 0, maxReps = 0, max1RM = 0;
  let best1RMSet = null;
  sets.forEach(s => {
    if (s.kg && s.kg > maxKg) maxKg = s.kg;
    if (s.reps && s.reps > maxReps) maxReps = s.reps;
    if (s.kg && s.reps) {
      const vol = s.kg * s.reps;
      if (vol > maxVol) maxVol = vol;
      const oneRM = s.kg * (1 + s.reps / 30);
      if (oneRM > max1RM) { max1RM = oneRM; best1RMSet = s; }
    }
  });

  const repVals = sets.filter(s => s.reps && s.reps > 0).map(s => s.reps);
  const kgVals = sets.filter(s => s.kg && s.kg > 0).map(s => s.kg);
  const durVals = sets.filter(s => s.duration && s.duration > 0).map(s => s.duration);

  let bestHtml = `<div class="best-row">`;
  if (hasWeight) {
    bestHtml += `
      <span class="best-item">🏆 Best KG: <strong>${maxKg > 0 ? maxKg : '—'}</strong></span>
      <span class="best-item">🏆 Best Volume: <strong>${maxVol > 0 ? Math.round(maxVol) : '—'}</strong></span>
      <span class="best-item">🏆 Best 1RM: <strong>${max1RM > 0 ? Math.round(max1RM) : '—'}</strong></span>`;
  }
  if (hasReps) {
    bestHtml += `<span class="best-item">🏆 Best Reps: <strong>${maxReps > 0 ? maxReps : '—'}</strong></span>`;
  }
  bestHtml += `</div>`;

  let html = bestHtml;
  if (repVals.length) html += statBlock('Reps', repVals);
  if (kgVals.length) html += statBlock('KG', kgVals);
  if (durVals.length) html += statBlock('Duration (sec)', durVals);
  if (best1RMSet) {
    html += `<div style="margin-top:12px; font-size:13px; color:var(--text-secondary);">💪 Best 1RM on ${formatDate(best1RMSet.date)}: ${Math.round(best1RMSet.kg)} kg × ${best1RMSet.reps} reps → ${Math.round(max1RM)} kg</div>`;
  }

  if (hasReps) {
    html += `
      <div class="chart-container">
        <div class="chart-title">📈 Reps per day</div>
        <canvas id="repsChart"></canvas>
      </div>`;
  }
  if (hasWeight) {
    html += `
      <div class="chart-container">
        <div class="chart-title">🏋️ With weight (KG · 1RM · Volume)</div>
        <canvas id="weightChart"></canvas>
      </div>`;
  }

  out.innerHTML = html;

  setTimeout(() => {
    if (hasReps) {
      const ctx = document.getElementById('repsChart')?.getContext('2d');
      if (ctx) {
        const map = {};
        repsHistory.forEach(h => {
          if (!map[h.date]) map[h.date] = { sum: 0, count: 0, max: 0 };
          map[h.date].sum += h.reps;
          map[h.date].count++;
          if (h.reps > map[h.date].max) map[h.date].max = h.reps;
        });
        const sortedDates = Object.keys(map).sort();
        const avgReps = sortedDates.map(d => map[d].count ? map[d].sum / map[d].count : null);
        const maxRepsData = sortedDates.map(d => map[d].max);

        repsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: sortedDates.map(d => formatDate(d)),
            datasets: [
              { label: 'Avg Reps', data: avgReps, borderColor: '#E7BB4E', backgroundColor: 'rgba(231,187,78,0.1)', tension: 0.2, pointRadius: 4, fill: true },
              { label: 'Max Reps', data: maxRepsData, borderColor: '#EF9548', backgroundColor: 'rgba(239,149,72,0.05)', tension: 0.2, pointRadius: 3, borderDash: [5, 4] }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: { legend: { labels: { color: '#CDBE9C', font: { weight: 'bold' } } } },
            scales: {
              y: { grid: { color: '#3A2F1C' }, ticks: { color: '#9A8B6C' } },
              x: { grid: { display: false }, ticks: { color: '#9A8B6C', maxRotation: 45 } }
            }
          }
        });
      }
    }

    if (hasWeight) {
      const ctx = document.getElementById('weightChart')?.getContext('2d');
      if (ctx) {
        const map = {};
        weightHistory.forEach(h => {
          if (!map[h.date]) map[h.date] = { kgSum: 0, count: 0, oneRMSum: 0, oneRMCnt: 0, volumeSum: 0, volumeCnt: 0 };
          if (h.kg !== null) { map[h.date].kgSum += h.kg; map[h.date].count++; }
          if (h.oneRM !== null) { map[h.date].oneRMSum += h.oneRM; map[h.date].oneRMCnt++; }
          if (h.volume !== null) { map[h.date].volumeSum += h.volume; map[h.date].volumeCnt++; }
        });
        const sortedDates = Object.keys(map).sort();
        const kgData = sortedDates.map(d => map[d].count ? map[d].kgSum / map[d].count : null);
        const oneRMData = sortedDates.map(d => map[d].oneRMCnt ? map[d].oneRMSum / map[d].oneRMCnt : null);
        const volumeData = sortedDates.map(d => map[d].volumeCnt ? map[d].volumeSum / map[d].volumeCnt : null);

        weightChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: sortedDates.map(d => formatDate(d)),
            datasets: [
              { label: 'Avg KG', data: kgData, borderColor: '#E7BB4E', backgroundColor: 'rgba(231,187,78,0.1)', tension: 0.2, pointRadius: 4 },
              { label: 'Avg 1RM', data: oneRMData, borderColor: '#5FD08A', backgroundColor: 'rgba(95,208,138,0.1)', tension: 0.2, pointRadius: 4 },
              { label: 'Avg Volume', data: volumeData, borderColor: '#5B8DEF', backgroundColor: 'rgba(91,141,239,0.1)', tension: 0.2, pointRadius: 4, hidden: true }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: { legend: { labels: { color: '#CDBE9C', font: { weight: 'bold' } } } },
            scales: {
              y: { grid: { color: '#3A2F1C' }, ticks: { color: '#9A8B6C' } },
              x: { grid: { display: false }, ticks: { color: '#9A8B6C', maxRotation: 45 } }
            }
          }
        });
      }
    }
  }, 50);
}

function statBlock(label, arr) {
  const min = Math.min(...arr), max = Math.max(...arr);
  const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
  return `
    <div class="stat-section-title">${label} (${arr.length} sets)</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-label">MIN</div><div class="stat-value">${trim(min)}</div></div>
      <div class="stat-box"><div class="stat-label">AVG</div><div class="stat-value">${trim(avg)}</div></div>
      <div class="stat-box"><div class="stat-label">MAX</div><div class="stat-value">${trim(max)}</div></div>
    </div>`;
}
function trim(n) { return Math.round(n * 10) / 10; }

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function escapeAttr(str) { return escapeHtml(str); }

</script>
