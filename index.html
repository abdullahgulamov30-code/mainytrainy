<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#221B12" />
<title>MainyTrainy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg: #221B12;
  --bg-elevated: #2E2517;
  --bg-card: #2A2216;
  --border: #4A3C24;
  --border-soft: #3A2F1C;
  --gold: #E7BB4E;
  --gold-strong: #F3CE6B;
  --text-primary: #F7F1E3;
  --text-secondary: #CDBE9C;
  --text-muted: #9A8B6C;
  --red: #E15B4D;
  --blue: #5B8DEF;
  --yellow: #E7C93A;
  --orange: #EF9548;
  --danger: #E15B4D;
  --radius: 10px;
  --radius-sm: 6px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{
  margin:0; padding:0;
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-weight:600;
  font-size:16px;
  min-height:100vh;
}
button, input, textarea, select{ font-family:inherit; }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 20px 14px;
}
.logo{
  font-family:var(--font-display);
  font-weight:900;
  letter-spacing:.06em;
  font-size:24px;
  color:var(--gold-strong);
  margin:0;
}
.btn-outline{
  background:transparent;
  border:1.5px solid var(--gold);
  color:var(--gold-strong);
  border-radius:var(--radius-sm);
  padding:10px 18px;
  font-weight:800;
  letter-spacing:.08em;
  font-size:13px;
  cursor:pointer;
  transition: all .15s;
}
.btn-outline.small{ padding:10px 16px; }
.btn-outline:hover{ background:var(--gold); color:#221B12; }
.status-bar{
  text-align:center;
  padding:10px 0;
  font-size:12px;
  font-weight:800;
  letter-spacing:.18em;
  border-top:1px solid var(--border-soft);
  border-bottom:1px solid var(--border-soft);
  color:var(--text-secondary);
}
.status-bar .dot{
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--red); margin-right:8px;
}
.status-bar.online .dot{ background:#5FD08A; }
.tabs{ display:flex; }
.tab{
  flex:1;
  background:transparent;
  border:none;
  border-bottom:3px solid var(--border-soft);
  color:var(--text-muted);
  font-weight:800;
  letter-spacing:.1em;
  font-size:13.5px;
  padding:16px 0;
  cursor:pointer;
}
.tab.active{
  color:var(--gold-strong);
  border-bottom-color:var(--gold);
}
main#view{ padding:20px; padding-bottom:100px; }
.section-label{
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:13px;
  color:var(--text-muted);
  font-weight:800;
  margin:4px 0 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.workout-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 18px 14px;
  margin-bottom:16px;
}
.workout-card h3{
  font-family:var(--font-display);
  font-weight:800;
  font-size:22px;
  margin:0 0 6px;
  color:var(--text-primary);
}
.workout-meta{
  color:var(--text-secondary);
  font-size:14px;
  font-weight:700;
}
.workout-row{
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer;
}
.workout-row .chev{ color:var(--gold); font-size:20px; font-weight:900; }
.workout-card hr{
  border:none; border-top:2px solid var(--gold);
  opacity:.85; margin:14px 0 10px;
}
.workout-card .delete-row{ text-align:right; }
.type-pip{
  display:inline-block; width:10px; height:10px; border-radius:50%;
  margin-right:8px; vertical-align:middle;
}
.btn-danger-text{
  background:none; border:none; color:var(--danger);
  font-weight:800; letter-spacing:.1em; font-size:13px; cursor:pointer; padding:6px 0;
}
.btn-gold{
  display:block; width:100%;
  background:var(--gold);
  color:#241B0C;
  border:none;
  border-radius:var(--radius-sm);
  padding:18px;
  font-weight:900;
  letter-spacing:.1em;
  font-size:15px;
  cursor:pointer;
  margin-top:8px;
}
.btn-gold-outline{
  display:block; width:100%;
  background:transparent;
  border:1.5px solid var(--gold);
  color:var(--gold-strong);
  border-radius:var(--radius-sm);
  padding:16px;
  font-weight:900;
  letter-spacing:.1em;
  font-size:14.5px;
  cursor:pointer;
}
.detail-header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:18px;
}
.back-link{
  background:none; border:none; color:var(--gold-strong);
  font-weight:800; font-size:16px; cursor:pointer; display:flex; align-items:center; gap:8px;
}
.detail-title{
  font-family:var(--font-display); font-weight:800; font-size:20px; margin-left:8px;
}
.title-row{ display:flex; align-items:center; }
.exercise-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:16px;
  position:relative;
}
.exercise-card.superset-group{
  border-left: 6px solid var(--gold);
}
.exercise-header{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
}
.exercise-header h4{
  font-family:var(--font-display); font-size:19px; font-weight:800; margin:0 0 4px;
}
.exercise-tag{
  display:inline-block;
  border:1px solid var(--border);
  color:var(--text-secondary);
  font-size:11px; font-weight:800; letter-spacing:.06em;
  padding:3px 8px; border-radius:5px; margin-top:2px;
}
.exercise-actions{ display:flex; align-items:center; gap:14px; }
.remove-link{ background:none; border:none; color:var(--danger); font-weight:800; font-size:12.5px; letter-spacing:.06em; cursor:pointer; }
.set-table{ width:100%; border-collapse:collapse; margin-top:12px; }
.set-table th{
  text-align:left; font-size:11px; letter-spacing:.06em; color:var(--text-muted);
  font-weight:800; padding-bottom:6px; border-bottom:1px solid var(--border-soft);
}
.set-table td{ padding:6px 4px; vertical-align:middle; }
.set-num{ color:var(--text-secondary); font-weight:800; width:20px; font-size:13px; }
.set-target{ display:block; font-size:10px; color:var(--text-muted); font-weight:700; margin-top:2px; }
.set-input{
  width:100%;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  color:var(--text-primary);
  border-radius:6px;
  padding:8px 4px;
  font-weight:700;
  font-size:14px;
  text-align:center;
  min-width:40px;
}
.set-input::placeholder{ color:var(--text-muted); font-weight:600; font-size:11px; }
.set-input.small-input{ padding:6px 2px; font-size:12px; min-width:30px; }
.set-x{ background:none;border:none;color:var(--text-muted); font-size:16px; cursor:pointer; padding:0 4px; }
.set-note-input{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--border-soft);
  color:var(--text-secondary);
  font-size:11px;
  padding:4px 2px;
  font-style:italic;
}
.set-note-input::placeholder{ color:var(--text-muted); font-size:10px; }
.compare-badge{
  display:block;
  font-size:9px;
  color:var(--text-muted);
  font-weight:700;
  letter-spacing:.05em;
  margin-top:2px;
}
.add-set-btn{
  width:100%;
  border:1.5px dashed var(--border);
  background:none;
  color:var(--gold-strong);
  border-radius:6px;
  padding:12px;
  font-weight:800;
  letter-spacing:.08em;
  font-size:12.5px;
  margin-top:8px;
  cursor:pointer;
}
.ex-notes{
  width:100%;
  background:transparent;
  border:none; border-top:1px solid var(--border-soft);
  color:var(--text-secondary);
  font-weight:600;
  font-style:italic;
  padding:10px 0 0;
  margin-top:8px;
  resize:vertical;
  min-height:36px;
}
.ex-notes::placeholder{ color:var(--text-muted); }
.add-exercise-box{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:18px;
}
.field-label{
  font-size:12px; letter-spacing:.1em; color:var(--text-muted); font-weight:800; margin-bottom:6px;
}
.text-input, .select-input{
  width:100%;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  color:var(--text-primary);
  border-radius:8px;
  padding:12px 14px;
  font-weight:700;
  font-size:15px;
  margin-bottom:10px;
}
.text-input::placeholder{ color:var(--text-muted); font-style:italic; font-weight:600; }
.row-flex{ display:flex; gap:10px; }
.row-flex .text-input{ margin-bottom:0; }
.template-grid{ display:grid; gap:14px; }
.template-card{
  background:var(--bg-card);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
}
.template-card:active{ border-color:var(--gold); }
.template-card h4{ font-family:var(--font-display); font-size:19px; margin:0 0 4px; }
.template-card p{ margin:0; color:var(--text-secondary); font-size:13px; font-weight:700; }
.template-swatch{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
.cal-header{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;
}
.cal-nav{
  background:transparent; border:1.5px solid var(--border); color:var(--gold-strong);
  border-radius:8px; width:44px; height:44px; font-size:18px; font-weight:800; cursor:pointer;
}
.cal-title{ font-family:var(--font-display); font-weight:800; font-size:20px; letter-spacing:.06em; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-dow{ text-align:center; font-size:11px; color:var(--text-muted); font-weight:800; letter-spacing:.08em; padding-bottom:6px; }
.cal-cell{
  aspect-ratio:1;
  display:flex; align-items:center; justify-content:center;
  border-radius:8px;
  font-weight:800;
  font-size:15px;
  color:var(--text-secondary);
  background:var(--bg-card);
  border:1px solid var(--border-soft);
  cursor:default;
}
.cal-cell.empty{ background:transparent; border:none; }
.cal-cell.today{ border-color:var(--gold); border-width:2px; }
.cal-cell.trained{ color:#20180C; font-weight:900; }
.cal-legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:22px; }
.legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-secondary); font-weight:700; }
.legend-swatch{ width:13px; height:13px; border-radius:4px; }
.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.stat-box{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 8px; text-align:center;
}
.stat-box .stat-label{ font-size:10px; letter-spacing:.1em; color:var(--text-muted); font-weight:800; margin-bottom:4px; }
.stat-box .stat-value{ font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--gold-strong); }
.stat-section-title{ font-weight:800; font-size:14px; color:var(--text-secondary); margin:20px 0 4px; letter-spacing:.04em; }
.empty-state{ color:var(--text-muted); font-weight:700; text-align:center; padding:40px 10px; font-size:14.5px; }
.best-row{
  display:flex; flex-wrap:wrap; gap:12px; margin:8px 0 12px;
  background:var(--bg-elevated); padding:10px 14px; border-radius:6px;
  border-left: 4px solid var(--gold);
}
.best-item{
  font-size:13px; font-weight:700; color:var(--text-secondary);
}
.best-item strong{ color:var(--gold-strong); font-family:var(--font-display); font-weight:900; }
.chart-container{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-top:16px;
}
.chart-container canvas{ max-height:200px; width:100% !important; }
.overlay{
  position:fixed; inset:0; background:rgba(20,15,8,.85);
  display:flex; align-items:center; justify-content:center; z-index:50;
}
.overlay.hidden{ display:none; }
.timer-box{
  background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
  padding:32px; text-align:center; width:80%; max-width:320px;
}
.timer-display{
  font-family:var(--font-display); font-size:52px; font-weight:900; color:var(--gold-strong); margin-bottom:20px;
}
.timer-controls{ display:flex; gap:10px; margin-bottom:14px; }
.btn-text{ background:none; border:none; color:var(--text-muted); font-weight:700; cursor:pointer; }
.modal-sheet{
  position:fixed; inset:0; z-index:60;
  background:rgba(20,15,8,.85);
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet.hidden{ display:none; }
.modal-inner{
  background:var(--bg); width:100%; max-width:560px;
  border-radius:20px 20px 0 0; padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:85vh; overflow-y:auto;
  border-top:1px solid var(--border);
}
.modal-title{ font-family:var(--font-display); font-size:22px; font-weight:800; margin:0 0 18px; }
@media (min-width: 720px){
  main#view{ max-width:640px; margin:0 auto; }
  .topbar, .status-bar, .tabs{ max-width:640px; margin:0 auto; }
}
</style>
</head>
<body>

<header class="topbar">
  <h1 class="logo">MAINY&nbsp;TRAINY</h1>
  <button id="timerBtn" class="btn-outline small">TIMER</button>
</header>

<div id="statusBar" class="status-bar offline">
  <span class="dot"></span> <span id="statusText">OFFLINE</span>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="workouts">WORKOUTS</button>
  <button class="tab" data-tab="calendar">CALENDAR</button>
  <button class="tab" data-tab="analysis">ANALYSIS</button>
</nav>

<main id="view"></main>

<div id="timerOverlay" class="overlay hidden">
  <div class="timer-box">
    <div id="timerDisplay" class="timer-display">00:00</div>
    <div class="timer-controls">
      <button id="timerStartPause" class="btn-gold">START</button>
      <button id="timerReset" class="btn-outline">RESET</button>
    </div>
    <button id="timerClose" class="btn-text">Close</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = "https://sysfeilongpxoyjxkzpq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5c2ZlaWxvbmdweG95anhrenBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MDc4MDAsImV4cCI6MjEwMzE4MzgwMH0.i7B1UdiRLeLEQnkznaKomfccXbfxHbu_n5mOnX1IeWg";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TEMPLATES = {
  Pull: {
    color: 'blue',
    exercises: [
      ex('Pull Ups', 'reps', [{}, {}, {}]),
      ex('Muscle Ups', 'reps', [{}, {}, {}]),
      ex('Radial Curls', 'reps', [{ label: 'Light' }, { label: 'Heavy' }], '1 light : 1 heavy'),
      ex('Over the Finger Curls', 'reps', [{ label: 'Heavy' }, { label: 'Heavy' }, { label: 'Light' }], '2 heavy : 1 light'),
      ex('Pronation Curls', 'reps', [{ label: 'Heavy' }, { label: 'Heavy' }, { label: 'Light' }], '2 heavy : 1 light'),
    ],
  },
  Push: {
    color: 'red',
    exercises: [
      ex('Dips', 'reps', [{}, {}, {}]),
      ex('Push Ups / Dumbbell Bench Press', 'reps', [{}, {}, {}]),
      ex('Cheat Curls', 'reps', [{ label: 'Heavy', target: '8-6' }, { label: 'Heavy', target: '8-6' }], '2 heavy - 8-6'),
      ex('Supination Pulldowns', 'reps', [{ label: 'Heavy' }, { label: 'Heavy' }, { label: 'Light' }], '2 heavy : 1 light'),
      ex('Rolldowns / Side Pressure', 'reps', [{ label: 'Heavy', target: '6-4' }, { label: 'Heavy', target: '6-4' }, { label: 'Light', target: '15 fast' }], '2 heavy 6-4 : 1 light 15'),
      ex('Wristcurls', 'reps', [{ label: 'Heavy', target: '6-8' }, { label: 'Heavy', target: '6-8' }, { label: 'Light', target: '15' }], '2 heavy 6-8 : 1 light 15'),
    ],
  },
  'Leg & Abs': {
    color: 'yellow',
    exercises: [
      ex('Frog Jumps', 'reps', [{}, {}, {}], '3 sets'),
      ex('Weighted Squats', 'reps', [{}, {}, {}], '3 sets'),
      ex('Leg Curls', 'reps', [{ label: 'Heavy' }, { label: 'Heavy' }, { label: 'Light' }], '2 heavy : 1 light'),
      ex('Standing Calf Raises', 'reps', [{ label: 'Heavy' }, { label: 'Heavy' }, { label: 'Light' }], '2 heavy : 1 light'),
      ex('Leg Raises', 'reps', [{}, {}, {}], '3 sets'),
      ex('Supinated Static Holds', 'duration', [{ target: '30s' }, { target: '15s' }], '30s & 15s'),
      ex('Over the Finger Holds', 'duration', [{ target: '30s' }, { target: '15s' }], '30s & 15s'),
    ],
  },
  Volleyball: { color: 'orange', exercises: [] },
  Custom: { color: 'gray', exercises: [] },
};

function ex(name, inputType, setDefs, note) {
  return {
    name,
    inputType,
    note: note || '',
    sets: setDefs.map(() => ({ reps: '', kg: '', duration: '', done: false, rpe: '', setNotes: '' })),
    setMeta: setDefs,
    notes: '',
    group: '',
  };
}

const TYPE_COLORS = {
  blue: '#5B8DEF', red: '#E15B4D', yellow: '#E7C93A', orange: '#EF9548', gray: '#8A7A56',
};

let workouts = [];
let currentTab = 'workouts';
let currentWorkoutId = null;
let calMonth = new Date();
let online = navigator.onLine;
let chartInstance = null;
let isSaving = false;

init();

async function init() {
  updateStatus();
  window.addEventListener('online', () => { online = true; updateStatus(); loadWorkouts(); });
  window.addEventListener('offline', () => { online = false; updateStatus(); });
  
  // 🔥 AUTOMATISCH SPEICHERN BEIM TAB-WECHSEL
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', async () => {
      await saveCurrentWorkoutIfNeeded();
      switchTab(btn.dataset.tab);
    });
  });
  
  // 🔥 AUTOMATISCH SPEICHERN BEIM SEITE VERLASSEN
  window.addEventListener('beforeunload', async () => {
    await saveCurrentWorkoutIfNeeded();
  });

  document.getElementById('timerBtn').addEventListener('click', openTimer);
  document.getElementById('timerClose').addEventListener('click', closeTimer);
  document.getElementById('timerStartPause').addEventListener('click', toggleTimer);
  document.getElementById('timerReset').addEventListener('click', resetTimer);

  await loadWorkouts();
  render();
}

// 🔥 NEUE FUNKTION: Speichert das aktuelle Workout, falls eins offen ist
async function saveCurrentWorkoutIfNeeded() {
  if (!currentWorkoutId) return;
  const w = workouts.find(x => x.id === currentWorkoutId);
  if (!w) return;
  await saveAllInputs(w);
}

function updateStatus() {
  const bar = document.getElementById('statusBar');
  const txt = document.getElementById('statusText');
  bar.classList.toggle('online', online);
  bar.classList.toggle('offline', !online);
  txt.textContent = online ? 'ONLINE' : 'OFFLINE';
}

async function loadWorkouts() {
  const { data, error } = await supabase
    .from('workouts')
    .select('*')
    .order('date', { ascending: false });
  if (error) { console.error(error); online = false; updateStatus(); return; }
  workouts = data || [];
}

function switchTab(tab) {
  currentTab = tab;
  currentWorkoutId = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  render();
}

function render() {
  if (currentWorkoutId) return renderWorkoutDetail(currentWorkoutId);
  if (currentTab === 'workouts') return renderWorkoutsList();
  if (currentTab === 'calendar') return renderCalendar();
  if (currentTab === 'analysis') return renderAnalysis();
}

function renderWorkoutsList() {
  const el = document.getElementById('view');
  el.innerHTML = `
    <div class="section-label">
      <span>Your Workouts</span>
      <button id="exportBtn" class="btn-outline small" style="font-size:11px;">⬇ EXPORT</button>
    </div>
    <div id="wlist"></div>
    <button id="newWorkoutBtn" class="btn-gold" style="margin-top:8px;">+ NEW WORKOUT</button>
  `;

  document.getElementById('exportBtn').addEventListener('click', exportData);

  const list = el.querySelector('#wlist');
  if (!workouts.length) {
    list.innerHTML = `<div class="empty-state">Noch keine Workouts geloggt.<br>Starte dein erstes Workout unten.</div>`;
  }
  workouts.forEach(w => {
    const card = document.createElement('div');
    card.className = 'workout-card';
    const color = TYPE_COLORS[TEMPLATES[w.type]?.color] || TYPE_COLORS.gray;
    card.innerHTML = `
      <div class="workout-row" data-open="${w.id}">
        <div>
          <h3><span class="type-pip" style="background:${color}"></span>${escapeHtml(w.type)}</h3>
          <div class="workout-meta">${(w.exercises || []).length} ex · ${formatDate(w.date)} · ${w.finished ? '✅ Finished' : '⏳ In Progress'}</div>
        </div>
        <span class="chev">›</span>
      </div>
      <hr>
      <div class="delete-row"><button class="btn-danger-text" data-delete="${w.id}">DELETE</button></div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('[data-open]').forEach(n => n.addEventListener('click', () => {
    currentWorkoutId = n.dataset.open;
    render();
  }));
  list.querySelectorAll('[data-delete]').forEach(n => n.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Workout wirklich löschen?')) return;
    await supabase.from('workouts').delete().eq('id', n.dataset.delete);
    await loadWorkouts();
    render();
  }));

  el.querySelector('#newWorkoutBtn').addEventListener('click', openTemplatePicker);
}

function exportData() {
  if (!workouts.length) { alert('Keine Daten zum Exportieren.'); return; }
  const dataStr = JSON.stringify(workouts, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mainytrainy_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function openTemplatePicker() {
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.innerHTML = `
    <div class="modal-inner">
      <h3 class="modal-title">Choose a workout</h3>
      <div style="margin-bottom:16px;">
        <label style="font-size:12px; letter-spacing:.1em; color:var(--text-muted); font-weight:800; display:block; margin-bottom:6px;">DATE</label>
        <input type="date" id="newWorkoutDate" class="text-input" style="margin-bottom:0;" value="${new Date().toISOString().slice(0,10)}" />
      </div>
      <div class="template-grid" id="tplGrid"></div>
    </div>`;
  document.body.appendChild(sheet);
  sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.remove(); });

  const grid = sheet.querySelector('#tplGrid');
  Object.keys(TEMPLATES).forEach(name => {
    const tpl = TEMPLATES[name];
    const card = document.createElement('div');
    card.className = 'template-card';
    card.innerHTML = `<div><h4>${escapeHtml(name)}</h4><p>${tpl.exercises.length ? tpl.exercises.length + ' exercises' : 'Blank'}</p></div>
      <span class="template-swatch" style="background:${TYPE_COLORS[tpl.color]}"></span>`;
    card.addEventListener('click', async () => {
      const dateInput = document.getElementById('newWorkoutDate');
      const date = dateInput ? dateInput.value : new Date().toISOString().slice(0,10);
      sheet.remove();
      await createWorkout(name, date);
    });
    grid.appendChild(card);
  });
}

async function createWorkout(typeName, date) {
  const tpl = TEMPLATES[typeName];
  const exercises = JSON.parse(JSON.stringify(tpl.exercises));
  const payload = {
    type: typeName,
    date: date || new Date().toISOString().slice(0, 10),
    finished: false,
    exercises,
  };
  const { data, error } = await supabase.from('workouts').insert(payload).select().single();
  if (error) { alert('Fehler beim Speichern.'); console.error(error); return; }
  workouts.unshift(data);
  currentWorkoutId = data.id;
  render();
}

function renderWorkoutDetail(id) {

  });
  
  document.getElementById('deleteWBtn').addEventListener('click', async () => {
    if (!confirm('Löschen?')) return;

  document.getElementById('finishBtn').addEventListener('click', async () => {

  document.getElementById('addExBtn').addEventListener('click', async () => {
    const name = document.getElementById('newExName').value.trim();
    const type = document.getElementById('newExType').value;

    if (!name) return;

}

async function saveAllInputs(w) {
  if (!w || isSaving) return;
  isSaving = true;
  try {
    const inputs = document.querySelectorAll('input.set-input');
    const exercises = JSON.parse(JSON.stringify(w.exercises || []));
    inputs.forEach(inp => {
      const exI = parseInt(inp.dataset.ex);
      const setIdx = parseInt(inp.dataset.set);
      const field = inp.dataset.field;
      const value = inp.value;
      if (exercises[exI] && exercises[exI].sets[setIdx]) {
        exercises[exI].sets[setIdx][field] = value;
      }
    });
    document.querySelectorAll('input.set-rpe').forEach(inp => {
      const exI = parseInt(inp.dataset.ex);
      const setIdx = parseInt(inp.dataset.set);
      if (exercises[exI] && exercises[exI].sets[setIdx]) {
        exercises[exI].sets[setIdx].rpe = inp.value;
      }
    });
    document.querySelectorAll('input.set-note-input').forEach(inp => {
      const exI = parseInt(inp.dataset.ex);
      const setIdx = parseInt(inp.dataset.set);
      if (exercises[exI] && exercises[exI].sets[setIdx]) {
        exercises[exI].sets[setIdx].setNotes = inp.value;
      }
    });
    document.querySelectorAll('textarea.ex-notes').forEach(ta => {
      const exI = parseInt(ta.dataset.notes);
      if (exercises[exI]) exercises[exI].notes = ta.value;
    });
    const idx = workouts.findIndex(x => x.id === w.id);
    if (idx > -1) workouts[idx].exercises = exercises;
    await patchWorkout(w.id, { exercises });
  } catch (e) {
    console.error('Fehler beim Speichern:', e);
  }
  isSaving = false;
}

function renderExerciseCard(w, exItem, exIdx) {
  const card = document.createElement('div');
  card.className = 'exercise-card';
  const isDuration = exItem.inputType === 'duration';
  const col1 = isDuration ? 'Duration' : 'Reps';

  if (exItem.group && exItem.group.trim() !== '') {
    card.classList.add('superset-group');
    card.style.borderLeftColor = 'var(--gold)';
  }

  let prevReps = '', prevKg = '', prevDur = '';
  const prevWorkout = getPreviousWorkoutWithExercise(w, exItem.name);
  if (prevWorkout) {
    const prevEx = prevWorkout.exercises.find(e => e.name === exItem.name);
    if (prevEx && prevEx.sets && prevEx.sets.length) {
      const lastSet = prevEx.sets[prevEx.sets.length - 1];
      if (lastSet.reps) prevReps = lastSet.reps;
      if (lastSet.kg) prevKg = lastSet.kg;
      if (lastSet.duration) prevDur = lastSet.duration;
    }
  }
  const compareText = (prevReps || prevKg || prevDur) ? `↺ last: ${prevReps ? prevReps + ' reps' : ''} ${prevKg ? prevKg + 'kg' : ''} ${prevDur ? prevDur + 's' : ''}`.trim() : '';

  const rows = (exItem.sets || []).map((s, sIdx) => {
    const meta = (exItem.setMeta && exItem.setMeta[sIdx]) || {};
    const targetNote = meta.label || meta.target ? `<span class="set-target">${[meta.label, meta.target].filter(Boolean).join(' · ')}</span>` : '';
    const col1Val = isDuration ? s.duration : s.reps;
    const col1Placeholder = isDuration ? (meta.target || 'sec') : '—';
    return `
      <tr>
        <td class="set-num">${sIdx + 1}${targetNote}</td>
        <td style="min-width:60px;">
          <input class="set-input" data-field="${isDuration ? 'duration' : 'reps'}" data-ex="${exIdx}" data-set="${sIdx}" placeholder="${col1Placeholder}" value="${escapeAttr(col1Val)}" />
          ${compareText ? `<span class="compare-badge">${escapeHtml(compareText)}</span>` : ''}
        </td>
        <td><input class="set-input" data-field="kg" data-ex="${exIdx}" data-set="${sIdx}" placeholder="kg" value="${escapeAttr(s.kg)}" /></td>
        <td><input class="set-input small-input" data-field="rpe" data-ex="${exIdx}" data-set="${sIdx}" placeholder="RPE" value="${escapeAttr(s.rpe || '')}" style="max-width:40px;" /></td>
        <td><input class="set-note-input" placeholder="Note..." data-ex="${exIdx}" data-set="${sIdx}" value="${escapeAttr(s.setNotes || '')}" /></td>
        <td><button class="set-x" data-removeset="${exIdx}:${sIdx}">×</button></td>
      </tr>`;
  }).join('');

  card.innerHTML = `
    <div class="exercise-header">
      <div>
        <h4>${escapeHtml(exItem.name)} ${exItem.group ? `<span style="font-size:12px;color:var(--gold);font-weight:700;">[${escapeHtml(exItem.group)}]</span>` : ''}</h4>
        <span class="exercise-tag">${isDuration ? 'TIME' : 'SETS & REPS'}</span>
        ${exItem.note ? `<div class="set-target" style="margin-top:6px;">${escapeHtml(exItem.note)}</div>` : ''}
      </div>
      <div class="exercise-actions">
        <button class="remove-link" data-removeex="${exIdx}">REMOVE</button>
      </div>
    </div>
    <table class="set-table">
      <thead><tr><th>#</th><th>${col1}</th><th>KG</th><th>RPE</th><th>Note</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="add-set-btn" data-addset="${exIdx}">+ ADD SET</button>
    <textarea class="ex-notes" placeholder="Exercise Notes..." data-notes="${exIdx}">${escapeHtml(exItem.notes || '')}</textarea>
  `;

  card.querySelectorAll('.set-input, .set-rpe, .set-note-input').forEach(inp => {
    inp.addEventListener('input', () => {
      if (inp.classList.contains('set-input') && inp.dataset.field) {
        updateSetField(w, +inp.dataset.ex, +inp.dataset.set, inp.dataset.field, inp.value);
      } else if (inp.classList.contains('set-rpe')) {
        updateSetField(w, +inp.dataset.ex, +inp.dataset.set, 'rpe', inp.value);
      } else if (inp.classList.contains('set-note-input')) {
        updateSetField(w, +inp.dataset.ex, +inp.dataset.set, 'setNotes', inp.value);
      }
    });
  });

  card.querySelectorAll('[data-removeset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [exI, sI] = btn.dataset.removeset.split(':').map(Number);
      removeSet(w, exI, sI);
    });
  });

  card.querySelector('[data-addset]').addEventListener('click', () => addSet(w, exIdx));
  card.querySelector('[data-removeex]').addEventListener('click', () => removeExercise(w, exIdx));
  card.querySelector('[data-notes]').addEventListener('change', (e) => updateExerciseNotes(w, exIdx, e.target.value));

  return card;
}

async function patchWorkout(id, patch) {
  const { data, error } = await supabase.from('workouts').update(patch).eq('id', id).select().single();
  if (error) { console.error(error); return; }
  const idx = workouts.findIndex(x => x.id === id);
  if (idx > -1) workouts[idx] = data;
}

function cloneExercises(w) { return JSON.parse(JSON.stringify(w.exercises || [])); }

async function updateSetField(w, exI, sI, field, value) {
  const exercises = cloneExercises(w);
  if (!exercises[exI] || !exercises[exI].sets[sI]) return;
  exercises[exI].sets[sI][field] = value;
  await patchWorkout(w.id, { exercises });
}

async function removeSet(w, exI, sI) {
  const exercises = cloneExercises(w);
  exercises[exI].sets.splice(sI, 1);
  if (exercises[exI].setMeta) exercises[exI].setMeta.splice(sI, 1);
  await patchWorkout(w.id, { exercises });
  render();
}

// 🔥 GEFIXTE ADD SET FUNKTION
async function addSet(w, exI) {
  const exercises = cloneExercises(w);
  const currentSets = exercises[exI].sets;
  currentSets.push({ reps: '', kg: '', duration: '', done: false, rpe: '', setNotes: '' });
  if (!exercises[exI].setMeta) exercises[exI].setMeta = [];
  exercises[exI].setMeta.push({});
  await patchWorkout(w.id, { exercises });
  render();
}

async function removeExercise(w, exI) {
  const exercises = cloneExercises(w);
  exercises.splice(exI, 1);
  await patchWorkout(w.id, { exercises });
  render();
}

async function updateExerciseNotes(w, exI, notes) {
  const exercises = cloneExercises(w);
  if (exercises[exI]) exercises[exI].notes = notes;
  await patchWorkout(w.id, { exercises });
}

function getPreviousWorkoutWithExercise(currentWorkout, exerciseName) {
  const currentDate = currentWorkout.date;
  let prev = null;
  for (const w of workouts) {
    if (w.id === currentWorkout.id) continue;
    if (w.date >= currentDate) continue;
    if (!w.exercises) continue;
    const hasEx = w.exercises.some(e => e.name === exerciseName);
    if (hasEx) {
      if (!prev || w.date > prev.date) prev = w;
    }
  }
  return prev;
}

function renderCalendar() {
  const el = document.getElementById('view');
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  el.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" id="calPrev">←</button>
      <div class="cal-title">${monthNames[month].toUpperCase()} ${year}</div>
      <button class="cal-nav" id="calNext">→</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <div class="legend-item"><span class="legend-swatch" style="background:${TYPE_COLORS.red}"></span>Push</div>
      <div class="legend-item"><span class="legend-swatch" style="background:${TYPE_COLORS.blue}"></span>Pull</div>
      <div class="legend-item"><span class="legend-swatch" style="background:${TYPE_COLORS.yellow}"></span>Leg & Abs</div>
      <div class="legend-item"><span class="legend-swatch" style="background:${TYPE_COLORS.orange}"></span>Volleyball</div>
    </div>
  `;
  document.getElementById('calPrev').addEventListener('click', () => { calMonth = new Date(year, month - 1, 1); render(); });
  document.getElementById('calNext').addEventListener('click', () => { calMonth = new Date(year, month + 1, 1); render(); });

  const grid = document.getElementById('calGrid');
  ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach(d => {
    const c = document.createElement('div'); c.className = 'cal-dow'; c.textContent = d; grid.appendChild(c);
  });

  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay() - 1;
  if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const byDate = {};
  workouts.forEach(w => { byDate[w.date] = byDate[w.date] || []; byDate[w.date].push(w); });
  const todayStr = new Date().toISOString().slice(0, 10);

  for (let i = 0; i < startOffset; i++) {
    const c = document.createElement('div'); c.className = 'cal-cell empty'; grid.appendChild(c);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayWorkouts = byDate[dateStr];
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (dateStr === todayStr) cell.classList.add('today');
    if (dayWorkouts && dayWorkouts.length) {
      cell.classList.add('trained');
      const colorKey = TEMPLATES[dayWorkouts[0].type]?.color || 'gray';
      cell.style.background = TYPE_COLORS[colorKey];
    }
    cell.textContent = d;
    grid.appendChild(cell);
  }
}

function allKnownExerciseNames() {
  const names = new Set();
  Object.values(TEMPLATES).forEach(t => t.exercises.forEach(e => names.add(e.name)));
  workouts.forEach(w => (w.exercises || []).forEach(e => names.add(e.name)));
  return Array.from(names).sort();
}

function renderAnalysis() {
  const el = document.getElementById('view');
  const names = allKnownExerciseNames();
  el.innerHTML = `
    <div class="section-label">Exercise Analysis</div>
    <select class="select-input" id="exSelect">
      <option value="">Choose an exercise…</option>
      ${names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('')}
    </select>
    <div id="statOut"></div>
  `;
  document.getElementById('exSelect').addEventListener('change', (e) => renderStatsFor(e.target.value));
}

function renderStatsFor(name) {
  const out = document.getElementById('statOut');
  if (!name) { out.innerHTML = ''; if (chartInstance) { chartInstance.destroy(); chartInstance = null; } return; }

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const sets = [];
  const history = [];
  workouts.forEach(w => {
    (w.exercises || []).forEach(exItem => {
      if (exItem.name !== name) return;
      (exItem.sets || []).forEach(s => {
        const reps = parseFloat(s.reps);
        const kg = parseFloat(s.kg);
        const dur = parseFloat(s.duration);
        const validReps = !isNaN(reps) && reps > 0;
        const validKg = !isNaN(kg) && kg > 0;
        const validDur = !isNaN(dur) && dur > 0;
        if (validReps || validKg || validDur) {
          sets.push({ reps, kg, duration: dur, date: w.date });
          if (validKg && validReps) {
            history.push({ date: w.date, kg, volume: kg * reps, oneRM: kg * (1 + reps / 30) });
          } else if (validKg) {
            history.push({ date: w.date, kg, volume: null, oneRM: null });
          }
        }
      });
    });
  });

  if (!sets.length) {
    out.innerHTML = `<div class="empty-state">Noch keine Werte für „${escapeHtml(name)}“.</div>`;
    return;
  }

  let maxKg = 0, maxVol = 0, maxReps = 0, max1RM = 0;
  let best1RMSet = null;
  sets.forEach(s => {
    if (s.kg && s.kg > maxKg) maxKg = s.kg;
    if (s.reps && s.reps > maxReps) maxReps = s.reps;
    if (s.kg && s.reps) {
      const vol = s.kg * s.reps;
      if (vol > maxVol) maxVol = vol;
      const oneRM = s.kg * (1 + s.reps / 30);
      if (oneRM > max1RM) { max1RM = oneRM; best1RMSet = s; }
    }
  });

  const repVals = sets.filter(s => s.reps && s.reps > 0).map(s => s.reps);
  const kgVals = sets.filter(s => s.kg && s.kg > 0).map(s => s.kg);
  const durVals = sets.filter(s => s.duration && s.duration > 0).map(s => s.duration);

  let html = `
    <div class="best-row">
      <span class="best-item">🏆 Best KG: <strong>${maxKg > 0 ? maxKg : '—'}</strong></span>
      <span class="best-item">🏆 Best Volumen: <strong>${maxVol > 0 ? Math.round(maxVol) : '—'}</strong></span>
      <span class="best-item">🏆 Best 1RM: <strong>${max1RM > 0 ? Math.round(max1RM) : '—'}</strong></span>
    </div>
  `;
  if (repVals.length) html += statBlock('Reps', repVals);
  if (kgVals.length) html += statBlock('KG', kgVals);
  if (durVals.length) html += statBlock('Duration (sec)', durVals);
  if (best1RMSet) {
    html += `<div style="margin-top:12px; font-size:13px; color:var(--text-secondary);">💪 Best 1RM am ${formatDate(best1RMSet.date)}: ${Math.round(best1RMSet.kg)} kg × ${best1RMSet.reps} reps → ${Math.round(max1RM)} kg</div>`;
  }

  html += `<div class="chart-container"><canvas id="progChart"></canvas></div>`;
  out.innerHTML = html;

  setTimeout(() => {
    const ctx = document.getElementById('progChart')?.getContext('2d');
    if (!ctx) return;
    const map = {};
    history.forEach(h => {
      if (!map[h.date]) map[h.date] = { kgSum: 0, count: 0, oneRMSum: 0, oneRMCnt: 0, volumeSum: 0, volumeCnt: 0 };
      if (h.kg !== null) { map[h.date].kgSum += h.kg; map[h.date].count++; }
      if (h.oneRM !== null) { map[h.date].oneRMSum += h.oneRM; map[h.date].oneRMCnt++; }
      if (h.volume !== null) { map[h.date].volumeSum += h.volume; map[h.date].volumeCnt++; }
    });
    const sortedDates = Object.keys(map).sort();
    const kgData = sortedDates.map(d => map[d].count ? map[d].kgSum / map[d].count : null);
    const oneRMData = sortedDates.map(d => map[d].oneRMCnt ? map[d].oneRMSum / map[d].oneRMCnt : null);
    const volumeData = sortedDates.map(d => map[d].volumeCnt ? map[d].volumeSum / map[d].volumeCnt : null);

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: sortedDates.map(d => formatDate(d)),
        datasets: [
          { label: 'Ø KG', data: kgData, borderColor: '#E7BB4E', backgroundColor: 'rgba(231,187,78,0.1)', tension: 0.2, pointRadius: 4 },
          { label: 'Ø 1RM', data: oneRMData, borderColor: '#5FD08A', backgroundColor: 'rgba(95,208,138,0.1)', tension: 0.2, pointRadius: 4 },
          { label: 'Ø Volumen', data: volumeData, borderColor: '#5B8DEF', backgroundColor: 'rgba(91,141,239,0.1)', tension: 0.2, pointRadius: 4, hidden: true }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { labels: { color: '#CDBE9C', font: { weight: 'bold' } } }
        },
        scales: {
          y: { grid: { color: '#3A2F1C' }, ticks: { color: '#9A8B6C' } },
          x: { grid: { display: false }, ticks: { color: '#9A8B6C', maxRotation: 45 } }
        }
      }
    });
  }, 50);
}

function statBlock(label, arr) {
  const min = Math.min(...arr), max = Math.max(...arr);
  const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
  return `
    <div class="stat-section-title">${label} (${arr.length} sets)</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-label">MIN</div><div class="stat-value">${trim(min)}</div></div>
      <div class="stat-box"><div class="stat-label">AVG</div><div class="stat-value">${trim(avg)}</div></div>
      <div class="stat-box"><div class="stat-label">MAX</div><div class="stat-value">${trim(max)}</div></div>
    </div>`;
}
function trim(n) { return Math.round(n * 10) / 10; }

let timerSeconds = 0, timerRunning = false, timerInterval = null;
function openTimer() { document.getElementById('timerOverlay').classList.remove('hidden'); }
function closeTimer() { document.getElementById('timerOverlay').classList.add('hidden'); }
function toggleTimer() {
  timerRunning = !timerRunning;
  document.getElementById('timerStartPause').textContent = timerRunning ? 'PAUSE' : 'START';
  if (timerRunning) {
    timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000);
  } else {
    clearInterval(timerInterval);
  }
}
function resetTimer() {
  timerSeconds = 0; timerRunning = false; clearInterval(timerInterval);
  document.getElementById('timerStartPause').textContent = 'START';
  updateTimerDisplay();
}
function updateTimerDisplay() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const s = String(timerSeconds % 60).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function escapeAttr(str) { return escapeHtml(str); }

</script>
